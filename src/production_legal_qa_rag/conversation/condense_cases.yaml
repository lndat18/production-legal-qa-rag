    expect: rewrite
    messages:
      - {role: user, content: "Khi nào người lao động được nhận trợ cấp thôi việc?"}
      - {role: assistant, content: "Người lao động làm việc thường xuyên từ đủ 12 tháng trở lên khi chấm dứt hợp đồng lao động được nhận trợ cấp thôi việc."}
      - {role: user, content: "Mỗi năm làm việc thì được tính bao nhiêu?"}
    expected_chunks:
      - {doc: blld, dieu: 46}
    draft: true

  - id: p5_giam_tru_phu_thuoc
    kind: pronoun
    expect: rewrite
    messages:
      - {role: user, content: "Giảm trừ gia cảnh cho bản thân người nộp thuế là bao nhiêu?"}
      - {role: assistant, content: "Mức giảm trừ gia cảnh cho bản thân người nộp thuế là 11 triệu đồng một tháng."}
      - {role: user, content: "Còn cho mỗi người phụ thuộc?"}
    expected_chunks:
