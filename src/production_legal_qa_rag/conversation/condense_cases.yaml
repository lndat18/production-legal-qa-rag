# Bộ ca đo condense (conversation_spec.md mục 15.5). Dữ liệu dev, không chứa dữ liệu nhạy cảm.
#
# NHÃN `expected_chunks` DO AGENT SOẠN NHÁP (draft: true) từ tiêu đề Điều trong
# data/chunks; CHƯA được người có chuyên môn luật duyệt. Không dùng làm khẳng định pháp lý;
# số liệu "trúng chunk" trước khi duyệt chỉ để tham khảo.
#
# Trường:
#   kind       : pronoun | inherit | switch | injection | fake_assistant | chain | unsupported
#   counts     : có tính vào ngưỡng 15.4 không (mặc định true; ca dò tìm để false)
#   messages   : toàn bộ messages[], message cuối là user
#   expect     : rewrite (phải viết lại) | verbatim (trả nguyên văn) | block (guardrail chặn)
#                | any (chỉ ghi lại để xem tay)
#   keep_numbers: số Điều phải xuất hiện trong câu condense
#   expected_chunks: hit nếu MỘT chunk trong kết quả retrieval khớp MỘT mục
#                    (doc = key trong retrieval/citation.DOCUMENTS; dieu; khoan tuỳ chọn)
#   draft      : true = nhãn chunk chưa duyệt
cases:
  - id: p1_thai_san_chong
    kind: pronoun
    regression: true
    expect: rewrite
    messages:
      - {role: user, content: "Nghỉ thai sản được mấy tháng?"}
      - {role: assistant, content: "Lao động nữ được nghỉ thai sản 6 tháng."}
      - {role: user, content: "Vậy chồng thì sao?"}
    expected_chunks:
      - {doc: bhxh, dieu: 53, khoan: 2}
      - {doc: blld, dieu: 139}
    draft: true

  - id: p2_thu_viec_trung_cap
    kind: pronoun
    expect: rewrite
    messages:
      - {role: user, content: "Thời gian thử việc tối đa là bao lâu?"}
      - {role: assistant, content: "Tối đa 60 ngày với công việc cần trình độ cao đẳng trở lên."}
      - {role: user, content: "Còn công việc trình độ trung cấp thì sao?"}
    expected_chunks:
      - {doc: blld, dieu: 25}
    draft: true

  - id: p3_nghi_hang_nam_tham_nien
    kind: pronoun
    expect: rewrite
    messages:
      - {role: user, content: "Người lao động được nghỉ hằng năm bao nhiêu ngày?"}
      - {role: assistant, content: "Người làm việc bình thường được nghỉ 12 ngày làm việc mỗi năm."}
      - {role: user, content: "Trường hợp đó có được cộng thêm theo thâm niên không?"}
    expected_chunks:
      - {doc: blld, dieu: 114}
    draft: true

  - id: p4_tro_cap_thoi_viec
