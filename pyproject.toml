[project]
name = "production-legal-qa-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lndat", email = "datdev181104@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7.0",
    "python-docx>=1.2.0",
    "pyvi>=0.1.1",
    "pyyaml>=6.0.3",
    "transformers>=4.47.0",
    "typer>=0.27.1",
]

[project.scripts]
production-legal-qa-rag = "production_legal_qa_rag:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: test nạp model thật (~20s), bỏ qua bằng -m 'not slow'",
]
# "." để import được `tests.fixtures.blocks` và `tests.loader_under_test`.
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
    "mypy>=1.14",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff.lint.flake8-bugbear]
# typer.Option()/typer.Argument() làm default value là idiom chuẩn của Typer,
# không phải bug thật như B008 giả định (mutable default argument).
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[[tool.mypy.overrides]]
# pyvi không phát hành type stub / py.typed marker.
module = ["pyvi", "pyvi.*"]
ignore_missing_imports = true
