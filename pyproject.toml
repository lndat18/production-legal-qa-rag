[project]
name = "production-legal-qa-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lndat", email = "datdev181104@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "docx2txt>=0.9",
    "langchain>=1.3.15",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.5.1",
    "langchain-text-splitters>=1.1.2",
    "llama-index-core>=0.14.23",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-llms-groq>=0.5.0",
    "llama-index-readers-file>=0.6.0",
    "llama-index-vector-stores-qdrant>=0.10.3",
    "psycopg[binary]>=3.3.4",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "pyvi>=0.1.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.0",
    "sentence-transformers>=5.7.0",
    "tqdm>=4.70.0",
    "unstructured[docx]>=0.25.2",
]

[project.scripts]
production-legal-qa-rag = "production_legal_qa_rag:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." để import được `tests.fixtures.blocks` và `tests.loader_under_test`.
pythonpath = ["src", "."]

[dependency-groups]
dev = [
    "pytest>=8",
]
