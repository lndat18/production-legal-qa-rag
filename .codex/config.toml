#:schema https://developers.openai.com/codex/config-schema.json

# Project-scoped migration of .claude/settings.json. Command-specific policy is
# in .codex/rules/settings.rules; it is loaded only for trusted projects.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true

[agents.architect]
description = "Brainstorm and finalize a *_spec.md with the user before implementation."
config_file = "agents/architect.toml"

[agents.developer]
description = "Implement a finalized spec; commit locally only and hand off to tester."
config_file = "agents/developer.toml"

[agents.tester]
description = "Protect a spec with tests, then push/open the PR and monitor the checks gate."
config_file = "agents/tester.toml"

[agents.reviewer]
description = "Review a checks-passing PR against its spec; comment PASS or REVISE without merging."
config_file = "agents/reviewer.toml"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"
