name: Release

# Xuất bản image `api` lên GHCR theo tag vX.Y.Z (deploy_spec.md mục 11). Không tự deploy.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/lndat18/production-legal-qa-rag

jobs:
  gate:
    runs-on: ubuntu-latest
    # checks: read cần để tra check-runs; khai báo permissions ở job thì các quyền khác về none.
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit của tag phải thuộc main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit ${GITHUB_SHA} không phải tổ tiên của origin/main -- merge vào main trước khi tag."
            exit 1
          fi

      - name: Check run "checks" (CI) phải xanh trên đúng SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name == "checks")] | sort_by(.started_at) | last | .conclusion // "none"')"
          if [ "$conclusion" != "success" ]; then
            echo "::error::Check 'checks' trên ${GITHUB_SHA} chưa xanh (conclusion=${conclusion}) -- chờ CI xanh rồi xoá tag + push lại."
            exit 1
          fi

  build:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cu126]

    steps:
      - uses: actions/checkout@v4

      - name: Dọn disk (chỉ cu126)
        if: matrix.variant == 'cu126'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af
          df -h /

      - name: Tính tag image
        id: tags
        run: |
          tags="${IMAGE}:${GITHUB_REF_NAME}-${{ matrix.variant }}"
          if [ "${{ matrix.variant }}" = "cpu" ]; then
            tags="${tags}"$'\n'"${IMAGE}:latest"
          fi
          {
            echo "list<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          build-args: TORCH_VARIANT=${{ matrix.variant }}
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=min

      - name: df sau build
        if: always()
        run: df -h /
