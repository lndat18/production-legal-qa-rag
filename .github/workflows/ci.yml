name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests (skip slow/model-loading tests)
        run: uv run pytest -m "not slow"

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Dependency audit (pip-audit)
        run: uvx pip-audit
        continue-on-error: true

  reviewer-agent:
    needs: checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run reviewer agent
        id: reviewer
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Bạn đóng vai `reviewer` (xem `.claude/agents/reviewer.md`), nhưng đang chạy
            trong CI ở CHẾ ĐỘ READ-ONLY:

            - TUYỆT ĐỐI không dùng Write/Edit để sửa bất kỳ file nào.
            - Job `checks` (pytest/ruff/mypy) đã pass trước khi bạn chạy. KHÔNG đọc hay
              đánh giá lại kết quả test/CI — đó là phạm vi của tester, không phải bạn.
            - So diff của PR (`gh pr diff`) với spec.md gốc liên quan (nếu tìm thấy
              trong repo) và skill coding-convention.
            - Tập trung tìm: logic đáng ngờ, kiến trúc kém, code smell, security issue,
              duplication, naming, typing, maintainability, scalability, technical debt
              — những thứ test không bắt được.
            - Post feedback lên PR bằng `gh pr comment`, đúng format:
              `file | dòng | loại lỗi (architecture/security/scalability/smell/...) | mô tả cụ thể`.
            - Không submit review text as message — chỉ post qua gh pr comment.

            Note: PR branch đã được checkout sẵn ở thư mục hiện tại.

          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --disallowedTools "Write,Edit"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["PASS","REVISE"]},"summary":{"type":"string"}},"required":["verdict","summary"]}'

      - name: Enforce reviewer verdict
        if: >-
          steps.reviewer.outputs.structured_output != '' &&
          fromJSON(steps.reviewer.outputs.structured_output).verdict == 'REVISE'
        run: |
          echo "Reviewer agent kết luận REVISE — xem PR comment để biết chi tiết."
          exit 1

      - name: Note when reviewer agent was skipped
        if: steps.reviewer.outputs.structured_output == ''
        run: |
          echo "::warning::Reviewer agent không trả về kết quả (thường do PR này tự sửa" \
            "workflow file, GitHub tạm chặn action để chống lạm dụng secret). Job vẫn" \
            "pass nhưng CHƯA có review thật và CHƯA tự động merge — tự kiểm tra thủ công" \
            "PR này trước khi merge; các PR sau sẽ được reviewer-agent review và tự merge" \
            "bình thường."

      - name: Merge pull request when reviewer agent PASS
        if: >-
          steps.reviewer.outputs.structured_output != '' &&
          fromJSON(steps.reviewer.outputs.structured_output).verdict == 'PASS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
