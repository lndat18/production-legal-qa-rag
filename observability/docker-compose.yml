# Langfuse self-host + Prometheus + Grafana — chạy cạnh production, ngoài phạm vi
# deploy_spec.md (không phục vụ end-user). Tách riêng khỏi các compose chính. `api` production
# (nối vào network chung qua deploy/docker-compose.observe.yml, xem prometheus.yml) gửi trace
# sang Langfuse và expose /metrics cho Prometheus (observability_spec.md) khi có đủ
# LANGFUSE_PUBLIC_KEY/SECRET_KEY trong `.env` gốc.
#
#   ./observability/up.sh      # bật (bọc docker compose --env-file ../.env up -d --wait)
#   ./observability/down.sh    # dừng, giữ volume
# Biến OBS_* nằm ở .env gốc. Xoá sạch dữ liệu (mất trace/dashboard, không hoàn tác):
# `docker compose -f observability/docker-compose.yml --env-file .env down -v`.
#
# Nặng nhất là ClickHouse + MinIO. Tổng mem_limit ~5.4GB — đừng bật cùng lúc với việc load
# model embedding/rerank nếu máy yếu (deploy_spec.md mục 10).
name: legal-qa-observability

x-defaults: &defaults
  restart: unless-stopped

# Phụ thuộc và biến môi trường dùng chung cho langfuse-worker và langfuse-web.
x-langfuse-depends-on: &langfuse-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://${OBS_POSTGRES_USER:-langfuse}:${OBS_POSTGRES_PASSWORD:?}@postgres:5432/${OBS_POSTGRES_DB:-langfuse}
  SALT: ${OBS_SALT:?OBS_SALT bắt buộc, xem .env.example}
  ENCRYPTION_KEY: ${OBS_ENCRYPTION_KEY:?OBS_ENCRYPTION_KEY bắt buộc (hex 64 ký tự), xem .env.example}
  TELEMETRY_ENABLED: ${OBS_TELEMETRY_ENABLED:-false}
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: ${OBS_CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${OBS_CLICKHOUSE_PASSWORD:?}
  # ClickHouse local là một node đơn lẻ, không có ZooKeeper/Keeper.
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_AUTH: ${OBS_REDIS_AUTH:?}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${OBS_MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${OBS_MINIO_ROOT_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${OBS_MINIO_ROOT_USER:-minio}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${OBS_MINIO_ROOT_PASSWORD:?}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  # --- Langfuse (theo docker-compose.yml chính thức của langfuse/langfuse) ---
  postgres:
    <<: *defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${OBS_POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${OBS_POSTGRES_PASSWORD:?OBS_POSTGRES_PASSWORD bắt buộc, xem .env.example}
      POSTGRES_DB: ${OBS_POSTGRES_DB:-langfuse}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OBS_POSTGRES_USER:-langfuse}"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

  redis:
    <<: *defaults
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--requirepass",
        "${OBS_REDIS_AUTH:?OBS_REDIS_AUTH bắt buộc, xem .env.example}",
        "--maxmemory-policy",
        "noeviction",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${OBS_REDIS_AUTH:?}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

  clickhouse:
    <<: *defaults
    image: clickhouse/clickhouse-server:25.12
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${OBS_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${OBS_CLICKHOUSE_PASSWORD:?OBS_CLICKHOUSE_PASSWORD bắt buộc, xem .env.example}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    # Chỉ loopback, để tự kiểm tra bằng curl/DBeaver khi cần.
    ports:
      - "127.0.0.1:8123:8123"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O /dev/null http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Tăng nếu container bị OOMKilled (docker compose ps báo "Exited (137)").
    mem_limit: 1200m

  minio:
    <<: *defaults
    image: cgr.dev/chainguard/minio
    entrypoint: ["/bin/minio"]
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${OBS_MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${OBS_MINIO_ROOT_PASSWORD:?OBS_MINIO_ROOT_PASSWORD bắt buộc, xem .env.example}
    volumes:
      - langfuse_minio_data:/data
    ports:
      - "127.0.0.1:9090:9000" # S3 API — trình duyệt tải media qua URL này
      - "127.0.0.1:9091:9001" # Console web
    # Image tối giản, không chắc có wget/curl để healthcheck: nếu web/worker lỗi vì minio chưa
    # sẵn sàng, thêm retries/start_period ở service phụ thuộc thay vì ép healthcheck ở đây.
    mem_limit: 256m

  # Langfuse v4 lưu event/media vào S3, nhưng MinIO không tự tạo bucket.
  minio-init:
    image: cgr.dev/chainguard/minio
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 2
        done
        mc mb --ignore-existing local/langfuse
    environment:
      MINIO_ROOT_USER: ${OBS_MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${OBS_MINIO_ROOT_PASSWORD:?OBS_MINIO_ROOT_PASSWORD bắt buộc, xem .env.example}
    restart: "no"

  langfuse-worker:
    <<: *defaults
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    depends_on: *langfuse-depends-on
    environment: *langfuse-env
    # Worker Langfuse v4 cần heap Node.js lớn hơn mức 512 MB để khởi tạo.
    mem_limit: 1g

  langfuse-web:
    <<: *defaults
    image: docker.langfuse.com/langfuse/langfuse:4
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      # Next.js mặc định đọc HOSTNAME để bind. Phải lắng nghe mọi interface để `api`
      # trên network `legal-qa-observe` kết nối được, không chỉ interface default.
      HOSTNAME: 0.0.0.0
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: ${OBS_NEXTAUTH_SECRET:?OBS_NEXTAUTH_SECRET bắt buộc, xem .env.example}
      # Media: server đọc qua tên service nội bộ, nhưng trình duyệt nhận URL trực tiếp nên
      # phải dùng cổng host đã publish — hai endpoint khác nhau có chủ đích.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
    # `observe`: để api production (deploy/docker-compose.observe.yml) gọi được langfuse-web.
    networks: [default, observe]
    ports:
      - "127.0.0.1:3001:3000" # 3000 dành cho open-webui (deploy_spec.md mục 4)
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 -O /dev/null http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    # Next.js/Langfuse v4 cần heap Node.js >512 MB khi khởi tạo.
    mem_limit: 2g

  # --- Prometheus + Grafana (scrape `api` production, xem prometheus.yml) ---
  prometheus:
    <<: *defaults
    image: prom/prometheus:v2.53.0
    # `observe`: scrape api:8000 của production qua network chung.
    networks: [default, observe]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - langfuse_prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9092:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  grafana:
    <<: *defaults
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${OBS_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${OBS_GRAFANA_ADMIN_PASSWORD:?OBS_GRAFANA_ADMIN_PASSWORD bắt buộc, xem .env.example}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - langfuse_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3002:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

# Network chung với deploy/docker-compose.observe.yml (khai external ở đó). Tên cố định.
networks:
  observe:
    name: legal-qa-observe

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_prometheus_data:
  langfuse_grafana_data:
