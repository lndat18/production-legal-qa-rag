# Stack production (deploy_spec.md mục 4). Chạy bằng ./deploy/up.sh (tự dò GPU, build, up -d)
# hoặc thủ công trong deploy/: docker compose up -d. Dừng (giữ volume): docker compose down.
# Tunnel: COMPOSE_PROFILES=quick (mặc định) hoặc named (điền TUNNEL_TOKEN) — mục 3.
# GPU: thêm -f docker-compose.gpu.yml (mục 4.1).
# Không service nào publish cổng ra host; debug cục bộ thì thêm tạm
# ports: ["127.0.0.1:<cổng>:<cổng>"] (api 8000, open-webui 8080, postgres 5432).
name: legal-qa

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# Mạng nội bộ duy nhất; chỉ `cloudflared` mở kết nối outbound ra ngoài.
networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  openwebui_data:
  hf_cache:

services:
  postgres:
    <<: *defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DEPLOY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DEPLOY_POSTGRES_PASSWORD}
      # DB thật (openwebui) do deploy/initdb/ tạo khi volume khởi tạo lần đầu.
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  redis:
    <<: *defaults
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 320m

  api:
    <<: *defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        TORCH_VARIANT: cpu
    # Chỉ `api` nhận các bí mật LLM/backend (tên biến khớp 1:1 với config.py). File .env ở
    # root, dùng chung với dev/app (deploy_spec.md mục 7).
    env_file:
      - ../.env
    environment:
      # env_file không giãn ${VAR} bên trong chính nó nên URL này dựng ở đây (mục 7).
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ../data/bm25:/app/data/bm25:ro
      - hf_cache:/home/appuser/.cache/huggingface
      # tools/ không có trong image — mount để chạy CLI trong container, vd.:
      #   docker compose exec api python tools/cache.py flush
      - ../tools:/app/tools:ro
    networks: [internal]
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # python:3.14-slim không có curl (mục 4).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Đo thật 2026-09-27: 1536m bị OOM-killer giết ngay lượt hỏi retrieval+rerank đầu tiên
    # (reranker + torch CUDA context + tải checkpoint chạm ~1.53GB).
    mem_limit: 3g

  open-webui:
    <<: *defaults
    image: ghcr.io/open-webui/open-webui:v0.11.4-slim
    environment:
      DATABASE_URL: postgresql://${DEPLOY_POSTGRES_USER}:${DEPLOY_POSTGRES_PASSWORD}@postgres:5432/openwebui
      # Trỏ tới `api` (api_spec.md mục 9): 1 model duy nhất "legal-qa".
      OPENAI_API_BASE_URL: http://api:8000/v1
      OPENAI_API_KEY: ${CHATBOT_API_KEY}
      ENABLE_OLLAMA_API: "false"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      # Đăng ký mở (chốt 2026-09-21): tài khoản đầu tiên là admin — đăng ký trước khi công bố URL.
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: user
      # Tắt các lời gọi phụ tới model (đốt hạn mức Groq nếu để mặc định).
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      # Cố định để phiên đăng nhập không mất khi container restart.
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      # Named tunnel: URL thật; quick tunnel: bỏ trống (mục 3).
      WEBUI_URL: ${WEBUI_URL:-}
    volumes:
      # Chỉ cache/ảnh cục bộ; dữ liệu chính nằm ở Postgres DB `openwebui`.
      - openwebui_data:/app/backend/data
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g

  # Cùng vai trò cloudflared (mục 3), tách 2 service vì lệnh khác nhau; chỉ 1 được bật theo
  # COMPOSE_PROFILES.
  cloudflared-quick:
    <<: *defaults
    image: cloudflare/cloudflared:2026.9.1
    profiles: ["quick"]
    command: tunnel --no-autoupdate --url http://open-webui:8080
    networks: [internal]
    depends_on:
      open-webui:
        condition: service_healthy

  cloudflared-named:
    <<: *defaults
    image: cloudflare/cloudflared:2026.9.1
    profiles: ["named"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks: [internal]
    depends_on:
      open-webui:
        condition: service_healthy
