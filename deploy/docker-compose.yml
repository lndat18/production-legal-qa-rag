# Bản triển khai production đầy đủ (deploy_spec.md mục 4). Chạy từ trong thư mục `deploy/`
# để compose tự nạp `deploy/.env` (cùng thư mục với file này):
#
#   cd deploy
#   cp .env.example .env   # điền giá trị thật, KHÔNG commit .env
#   docker compose up -d
#
# Mặc định dùng quick tunnel (COMPOSE_PROFILES=quick trong .env, mục 3) — không cần domain.
# Đổi sang named tunnel: COMPOSE_PROFILES=named + điền TUNNEL_TOKEN trong .env.
#
# Bật GPU cho reranker (khuyến nghị, không bắt buộc — mục 4.1):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Dừng (giữ volume): docker compose down
name: legal-qa

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Mạng nội bộ duy nhất; không service nào publish cổng ra host (trừ dev port tuỳ chọn,
  # comment sẵn bên dưới) — chỉ `cloudflared` mở kết nối ra ngoài (outbound).
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  openwebui_data:
  hf_cache:

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # DB mặc định của image là "postgres" (hành chính); 2 DB thật (openwebui, chatbot)
      # do deploy/initdb/ tạo khi volume được khởi tạo lần đầu.
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    logging: *default-logging
    # Chỉ mở tạm cho debug cục bộ (loopback), vd. chạy tools/ trực tiếp từ host:
    # ports:
    #   - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 320m
    logging: *default-logging

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        TORCH_VARIANT: cpu
    restart: unless-stopped
    # Toàn bộ biến LLM/backend (GROQ_*, HF_TOKEN, PINECONE_*, CHATBOT_API_KEY, REDIS_URL,
    # CHATLOG_DATABASE_URL...) khớp tên 1:1 với production_legal_qa_rag.config; chỉ `api`
    # cần các bí mật này (open-webui/postgres/redis không được cấp thừa).
    env_file:
      - .env
    environment:
      # Ghi đè bằng giá trị đã interpolate đúng từ các biến rời (REDIS_PASSWORD,
      # POSTGRES_USER/PASSWORD) — env_file KHÔNG tự giãn ${VAR} bên trong chính nó, nên
      # không thể để 2 biến này ở dạng template ngay trong .env (mục 7).
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CHATLOG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/chatbot
    volumes:
      - ../data/bm25:/app/data/bm25:ro
      - hf_cache:/home/appuser/.cache/huggingface
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Không dùng curl (không có trong python:3.14-slim) — mục 4.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Đo thật (2026-09-27): 1536m bị kernel OOM-killer giết ngay lượt hỏi retrieval+rerank
    # đầu tiên (reranker model + torch CUDA context + tải checkpoint qua hf-xet cộng dồn
    # chạm ~1.53GB) — deploy_spec.md mục 4 ghi rõ con số cũ chỉ là gợi ý ban đầu, đã điều
    # chỉnh theo số đo thật này.
    mem_limit: 3g
    logging: *default-logging
    # Chỉ mở tạm cho debug cục bộ (loopback): curl/Swagger `/docs`, vẫn không ra Internet.
    # ports:
    #   - "127.0.0.1:8000:8000"

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4-slim
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/openwebui
      # Kết nối tới `api` (mục 4, api_spec.md mục 9): 1 model duy nhất "legal-qa".
      OPENAI_API_BASE_URL: http://api:8000/v1
      OPENAI_API_KEY: ${CHATBOT_API_KEY}
      ENABLE_OLLAMA_API: "false"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      # Đăng ký mở (đã chốt 2026-09-21, mục 5): tài khoản đầu tiên đăng ký sẽ là admin —
      # đăng ký trước khi công bố URL.
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: user
      # Tắt lời gọi phụ tới model (đốt hạn mức Groq nếu để mặc định, api_spec.md mục 9).
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      # Cố định để phiên đăng nhập không mất khi container khởi động lại (mục 8, mục 9).
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      # Named tunnel: đặt URL thật; quick tunnel: bỏ trống, chấp nhận link tương đối (mục 3).
      WEBUI_URL: ${WEBUI_URL:-}
    volumes:
      # Cache/ảnh cục bộ; dữ liệu chính (user, chat, cấu hình) nằm ở Postgres DB `openwebui`.
      - openwebui_data:/app/backend/data
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    logging: *default-logging
    # Chỉ mở tạm cho debug cục bộ (loopback): mở thử UI mà chưa cần cloudflared.
    # ports:
    #   - "127.0.0.1:3000:8080"

  # Cùng vai trò "cloudflared" (mục 3), tách 2 service vì lệnh chạy khác nhau; chỉ 1 trong
  # 2 được bật tuỳ COMPOSE_PROFILES (mặc định "quick", đặt trong .env — mục 7).
  cloudflared-quick:
    image: cloudflare/cloudflared:2026.9.1
    profiles: ["quick"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://open-webui:8080
    networks: [internal]
    depends_on:
      open-webui:
        condition: service_healthy
    logging: *default-logging

  cloudflared-named:
    image: cloudflare/cloudflared:2026.9.1
    profiles: ["named"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks: [internal]
    depends_on:
      open-webui:
        condition: service_healthy
    logging: *default-logging
