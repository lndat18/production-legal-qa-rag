# `api` (FastAPI) đã expose /metrics (observability_spec.md mục 5). Dev chạy `api` trực
# tiếp trên host bằng `uv run uvicorn ...` (deploy/dev/docker-compose.yml chỉ có Redis +
# Postgres, không có service `api`) nên Prometheus — chạy trong Docker — không join chung
# network được với process trên host; dùng `host.docker.internal` (map qua `extra_hosts`
# ở docker-compose.yml, cần thiết trên Linux) thay vì tên service `api:8000`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: legal-qa-api
    static_configs:
      - targets: ["host.docker.internal:8000"]
